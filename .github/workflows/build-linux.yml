name: Build Linux

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential qtbase5-dev qttools5-dev \
            libqt5svg5-dev libgl1-mesa-dev zlib1g-dev libssl-dev

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build
        run: |
          cmake --build build -j$(nproc)

      - name: Install
        run: |
          cmake --install build --prefix "$PWD/install"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MultiMC-linux
          path: install/
